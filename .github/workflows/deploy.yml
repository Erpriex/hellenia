name: Build and deploy Hellenia

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hellenia-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Créer les fichiers de configuration
        env:
          HELLENIA_CONFIG: ${{ secrets.HELLENIA_CONFIG }}
          HELLENIA_HIBERNATE_CONFIG: ${{ secrets.HELLENIA_HIBERNATE_CONFIG }}
        run: |
          printf '%s' "$HELLENIA_CONFIG" \
            > src/main/resources/config.json

          printf '%s' "$HELLENIA_HIBERNATE_CONFIG" \
            > src/main/resources/hibernate.cfg.xml

      - name: Compiler le projet
        run: mvn --batch-mode clean package

      - name: Configurer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Envoyer le JAR
        run: |
          scp \
            target/Hellenia-1.0-SNAPSHOT-jar-with-dependencies.jar \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/hellenia.jar"

      - name: Déployer
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mv /tmp/hellenia.jar '${DEPLOY_PATH}/Hellenia-1.0-SNAPSHOT-jar-with-dependencies.jar' && \
             sudo systemctl restart hellenia && \
             sudo systemctl is-active --quiet hellenia"
